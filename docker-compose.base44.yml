services:
  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - CI=true
      - CHOKIDAR_USEPOLLING=true
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000"]
    healthcheck:
      # 127.0.0.1 (not localhost): the dev server listens on IPv4 only.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  node_modules:
